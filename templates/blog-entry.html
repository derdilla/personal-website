{% extends "base.html" %}

{% block styles %}
<style>
  {{ load_data(path="public/blog-entry.css") | safe }}
</style>
{% endblock styles %}

{% block content %}

<main>
  <article>
    <header>
      <h1><button class="back-button" onclick="window.location.href='/blog'">‹ Blog</button>{{ page.title }}</h1>
      <time datetime="{{ page.date }}"> {{ page.date }}</time>
    </header>
    {{ page.content | safe}}
  </article>
</main>
{% endblock content %}
